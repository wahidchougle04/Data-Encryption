<html>
    <head>
        <title>Sign-up Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <!-- Custom CSS -->
        <style>
            body {
                background-color: #f8f9fa;
                padding: 20px;
            }
            form {
                background-color: #ffffff;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            div {
                margin-bottom: 20px;
            }
            input[type="date"], input[type="password"], select {
                width: 25%;
                padding: 10px;
                margin: 5px 0 10px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            input[type="text"]{
                width: 27%;
                padding: 10px;
                margin: 5px 0 10px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            input[type="submit"] {
                background-color: #007bff;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            input[type="submit"]:hover {
                background-color: #0056b3;
            }
            .form-label {
                font-weight: bold;
                color: #333;
            }
            .form-group {
                margin-bottom: 15px;
            }
            .form-group label {
                display: block;
                margin-bottom: 5px;
            }
            .form-group input:focus, .form-group select:focus {
                border-color: #007bff;
                outline: none;
            }
        </style>
    </head>
    <body>
        <form action="Signupservlet" method="POST">
            <center><h1><b>SIGN-UP</b></h1></center>
            <div class="form-group">
                <label class="form-label">Personal Information</label>
                First Name: <input type="text" name="n1" required="required">
                Middle Name: <input type="text" name="n2" required="required">
                Last Name: <input type="text" name="n3" required="required"><br>
                Marital Status:
                <select id="maritalStatus" name="maritalStatus" required="required">
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="NA">Not to say</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Contact Information</label>
                Mobile Number: <input type="text" name="num" required="required">
                E-mail: <input type="text" name="mail" required="required"><br>
            </div>
            <div class="form-group">
                <label class="form-label">Address</label>
                <input type="text" name="street" placeholder="Street" required="required"><br>
                <input type="text" name="state" placeholder="State" required="required">
                <input type="text" name="city" placeholder="City" required="required">
                <input type="text" name="pincode" placeholder="Pincode" required="required"><br>
            </div>
            <div class="form-group">
                <label class="form-label">Sign up</label>
                Username: <input type="text" name="uname" required="required"><br>
                Password: <input type="password" name="pass" required="required">
                Confirm Password: <input type="password" name="cpass" required="required"><br>
             </div>
            <center><input type="submit" class="btn btn-primary" value="SIGN-UP"></center>
        </form>

        <!-- Bootstrap JS and dependencies -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    </body>
</html>
